<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>V35 WORKING</title>
<style>body{background:#0f172a;color:#fff;font-family:system-ui;padding-bottom:80px}
.card{background:#fff;color:#222;margin:12px;padding:16px;border-radius:16px}
.btn{width:100%;padding:12px;background:#00b16a;color:#fff;border:none;border-radius:10px;font-weight:900;margin-top:8px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:10px}
</style></head><body>
<div id="login"><div style="text-align:center;padding:20px"><div style="font-size:50px">🎁</div><h2>Kharcha Bachao</h2><p>50 Coins FREE</p></div>
<div class="card"><input id="n" placeholder="Name"><input id="e" placeholder="Email"><input id="p" placeholder="Pass"><input id="o" placeholder="OTP 123456"><button class="btn" onclick="reg()">Register</button><button class="btn" style="background:#333" onclick="log()">Login</button></div></div>
<div id="main" style="display:none"><div style="background:#00b16a;padding:12px;display:flex;justify-content:space-between"><b>Kharcha Bachao V35</b><span id="ct">0</span></div>
<div class="card"><h3>🇵🇰 Pak Bills</h3><select id="comp"><option>LESCO</option><option>MEPCO</option><option>SNGPL</option><option>SSGC</option><option>WASA Lahore</option><option>PTCL</option></select><input id="ref" placeholder="Ref No"><button class="btn" onclick="searchB()">Search Bill</button>
<div id="res" style="display:none;background:#e8ffe8;padding:10px;margin-top:10px;border-radius:10px"><b>Bill Found</b><br>Company: <span id="rc"></span><br>Ref: <span id="rr"></span><br>Amount: Rs <span id="ra"></span><br><button class="btn" onclick="alert('Easypaisa Paid Rs '+document.getElementById('ra').innerText)">💚 Easypaisa Pay</button><button class="btn" style="background:#ff6b00" onclick="alert('JazzCash Paid Rs '+document.getElementById('ra').innerText)">❤️ JazzCash Pay</button><button class="btn" style="background:#fff;color:#00b16a;border:2px solid #00b16a" onclick="payC()">🪙 Pay Coins 10% OFF</button></div></div>
<div class="card"><h3>📤 Upload</h3><input id="ua" placeholder="Amount"><input id="ur" placeholder="Ref"><button class="btn" style="background:#f59e0b" onclick="alert('Uploaded Rs '+document.getElementById('ua').value)">Upload</button></div>
<div class="card"><h3>👤 Profile - Settings</h3><div id="pbox"></div><button class="btn" style="background:red" onclick="localStorage.clear();location.reload()">Delete Account / Logout</button></div>
</div>
<script>
function reg(){let n=document.getElementById('n').value,e=document.getElementById('e').value.toLowerCase(),p=document.getElementById('p').value,o=document.getElementById('o').value;if(o!=='123456'){alert('OTP 123456');return}if(!n||!e||!p){alert('Name Email Pass');return}let u={name:n,email:e,pass:p};let users=JSON.parse(localStorage.getItem('users')||'[]');users.push(u);localStorage.setItem('users',JSON.stringify(users));localStorage.setItem('cur',JSON.stringify(u));localStorage.setItem(e+'_coin','50');start()}
function log(){let e=document.getElementById('e').value.toLowerCase(),p=document.getElementById('p').value;let users=JSON.parse(localStorage.getItem('users')||'[]');let u=users.find(x=>x.email===e&&x.pass===p);if(!u){alert('Galat');return}localStorage.setItem('cur',JSON.stringify(u));start()}
function start(){let cur=null;try{cur=JSON.parse(localStorage.getItem('cur'))}catch(e){}if(!cur){document.getElementById('login').style.display='block';document.getElementById('main').style.display='none';return}document.getElementById('login').style.display='none';document.getElementById('main').style.display='block';let coin=parseInt(localStorage.getItem(cur.email+'_coin')||'50');document.getElementById('ct').innerText=coin+' 🪙';document.getElementById('pbox').innerText=cur.name+'\n'+cur.email+'\nCoins: '+coin}
function searchB(){let c=document.getElementById('comp').value,r=document.getElementById('ref').value;if(!r){alert('Ref likho');return}let a=Math.floor(Math.random()*5000)+1000;document.getElementById('rc').innerText=c;document.getElementById('rr').innerText=r;document.getElementById('ra').innerText=a;document.getElementById('res').style.display='block'}
function payC(){let cur=JSON.parse(localStorage.getItem('cur'));let coin=parseInt(localStorage.getItem(cur.email+'_coin')||'0');let amt=parseInt(document.getElementById('ra').innerText);let need=Math.floor(amt/2);if(coin<need){alert('Coins kam Need '+need);return}localStorage.setItem(cur.email+'_coin',coin-need);alert('Paid! 10% OFF');start()}
start();
</script></body></html>
