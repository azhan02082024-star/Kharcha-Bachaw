<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kharcha Bachao V33 - Working</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff;padding-bottom:80px}
.top{background:linear-gradient(180deg,#0f172a,#00b16a);padding:30px 16px;text-align:center;border-radius:0 0 30px 30px}
.card{background:#fff;color:#222;margin:12px;border-radius:20px;padding:16px}
.tabs{display:flex;background:#eee;border-radius:12px;padding:4px;margin:10px 0}
.tab{flex:1;text-align:center;padding:10px;border-radius:10px;font-weight:800;cursor:pointer}
.tab.active{background:#00b16a;color:#fff}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;background:#00b16a;color:#fff;margin-top:10px;cursor:pointer}
input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;padding:8px 0;border-radius:20px 20px 0 0}
.bottom div{flex:1;text-align:center;color:#222;font-size:11px;font-weight:700;cursor:pointer}
.bottom div.active{color:#00b16a}
</style>
</head>
<body>
<div id="loginPage">
<div class="top"><div style="font-size:60px">🎁</div><h2>Kharcha Bachao</h2><p>Pakistan All Bills - 50 Coins FREE</p></div>
<div class="card">
<div class="tabs"><div class="tab active" id="tabL" onclick="showTab('login')">Login</div><div class="tab" id="tabR" onclick="showTab('reg')">Register</div></div>
<div id="loginBox"><input id="le" placeholder="Email"><input id="lp" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button></div>
<div id="regBox" style="display:none"><input id="rn" placeholder="Name"><input id="re" placeholder="Email"><input id="rm" placeholder="Mobile"><input id="rp" placeholder="Password"><input id="ro" placeholder="OTP 123456 likho"><button class="btn" style="background:#f59e0b" onclick="doReg()">Register + 50 Coins</button><p style="font-size:10px;margin-top:6px">OTP: 123456</p></div>
<p style="font-size:10px;text-align:center;margin-top:10px"><a href="#" onclick="localStorage.clear();location.reload()">Clear All</a></p>
</div>
</div>

<div id="mainPage" style="display:none">
<div style="background:#00b16a;padding:14px;display:flex;justify-content:space-between"><b>💎 Kharcha Bachao V33</b><span id="coinTop">0 🪙</span></div>
<div class="card" style="background:linear-gradient(135deg,#00b16a,#0f172a);color:#fff"><div style="display:flex;justify-content:space-between"><div><div>Welcome</div><div style="font-size:18px;font-weight:900" id="uname">User</div><div style="font-size:11px" id="uemail">email</div></div><div style="text-align:right"><div>Coins</div><div style="font-size:24px;font-weight:900" id="ucoin">0</div></div></div></div>

<div id="p-bills"><div class="card"><h3>🇵🇰 Pakistan Bills - Search & Pay</h3>
<div class="tabs"><div class="tab active" onclick="setCat('bijli',this)">Bijli</div><div class="tab" onclick="setCat('gas',this)">Gas</div><div class="tab" onclick="setCat('water',this)">Water</div><div class="tab" onclick="setCat('net',this)">Internet</div></div>
<select id="company"></select>
<input id="ref" placeholder="Reference No 14 Digit">
<button class="btn" onclick="searchB()">Search Bill</button>
<div id="result" style="display:none;margin-top:12px;background:#e8ffe8;padding:12px;border-radius:12px;border:2px solid #00b16a"><b>✅ Bill Found!</b><br>Company: <span id="rc"></span><br>Ref: <span id="rr"></span><br>Amount: Rs <span id="ra"></span><br><br><button class="btn" onclick="pay('easypaisa')">💚 Pay Easypaisa</button><button class="btn" style="background:#ff6b00" onclick="pay('jazzcash')">❤️ Pay JazzCash</button><button class="btn" style="background:#fff;color:#00b16a;border:2px solid #00b16a" onclick="pay('coins')">🪙 Pay Coins 10% OFF</button></div>
</div></div>

<div id="p-profile" style="display:none"><div class="card"><h3>👤 Profile - Settings</h3><div id="pbox"></div><input id="sn" placeholder="New Name"><input id="sm" placeholder="New Mobile"><input id="sp" placeholder="New Pass"><button class="btn" onclick="saveSet()">Save Settings</button><button class="btn" style="background:#fff;color:red;border:2px solid red;margin-top:8px" onclick="delAcc()">Delete Account</button><button class="btn" style="background:red;margin-top:8px" onclick="logout()">Logout</button></div></div>

<div class="bottom"><div class="active" id="b-bills" onclick="openP('bills')">🇵🇰<br>Bills</div><div id="b-profile" onclick="openP('profile')">👤<br>Profile</div></div>
</div>

<script>
let users = JSON.parse(localStorage.getItem('users')||'[]');
function showTab(t){document.getElementById('tabL').classList.toggle('active',t==='login');document.getElementById('tabR').classList.toggle('active',t==='reg');document.getElementById('loginBox').style.display=t==='login'?'block':'none';document.getElementById('regBox').style.display=t==='reg'?'block':'none'}
function doReg(){let n=document.getElementById('rn').value,e=document.getElementById('re').value.toLowerCase(),m=document.getElementById('rm').value,p=document.getElementById('rp').value,o=document.getElementById('ro').value;if(!n||!e||!p){alert('Name Email Pass likho');return}if(o!=='123456'){alert('OTP 123456 likho');return}if(users.find(x=>x.email===e)){alert('Already');showTab('login');return}let u={name:n,email:e,mobile:m,pass:p};users.push(u);localStorage.setItem('users',JSON.stringify(users));localStorage.setItem('current',JSON.stringify(u));localStorage.setItem(e+'_coin','50');alert('✅ Register OK - 50 Coins!');start()}
function doLogin(){let e=document.getElementById('le').value.toLowerCase(),p=document.getElementById('lp').value;let u=users.find(x=>x.email===e&&x.pass===p);if(!u){alert('Galat');return}localStorage.setItem('current',JSON.stringify(u));start()}
function setCat(c,el){let s=document.getElementById('company');document.querySelectorAll('#p-bills.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');if(c==='bijli')s.innerHTML='<option>LESCO</option><option>MEPCO</option><option>GEPCO</option><option>FESCO</option><option>IESCO</option><option>K-Electric</option><option>PESCO</option>';if(c==='gas')s.innerHTML='<option>SNGPL</option><option>SSGC</option>';if(c==='water')s.innerHTML='<option>WASA Lahore</option><option>WASA Faisalabad</option><option>KWSB Karachi</option>';if(c==='net')s.innerHTML='<option>PTCL</option><option>Nayatel</option><option>StormFiber</option>';}
function searchB(){let c=document.getElementById('company').value,r=document.getElementById('ref').value;if(!r||r.length<6){alert('Reference likho');return}let amt=Math.floor(Math.random()*5000)+1000;document.getElementById('rc').innerText=c;document.getElementById('rr').innerText=r;document.getElementById('ra').innerText=amt;document.getElementById('result').style.display='block';}
function pay(m){let a=document.getElementById('ra').innerText;if(m==='easypaisa')alert('✅ Easypaisa Rs '+a+' Paid! Txn EP'+Date.now());if(m==='jazzcash')alert('✅ JazzCash Rs '+a+' Paid! Txn JC'+Date.now());if(m==='coins'){let cur=JSON.parse(localStorage.getItem('current'));let coin=parseInt(localStorage.getItem(cur.email+'_coin')||'0');let need=Math.floor(a/2);if(coin<need){alert('Coins kam Need '+need+' You '+coin);return}localStorage.setItem(cur.email+'_coin',coin-need);alert('✅ Coins se Paid! 10% OFF');start()}}
function start(){let cur=null;try{cur=JSON.parse(localStorage.getItem('current')||'null')}catch(e){}if(!cur){document.getElementById('loginPage').style.display='block';document.getElementById('mainPage').style.display='none';setCat('bijli',document.querySelector('#p-bills.tab'));return}document.getElementById('loginPage').style.display='none';document.getElementById('mainPage').style.display='block';let coin=parseInt(localStorage.getItem(cur.email+'_coin')||'50');document.getElementById('coinTop').innerText=coin+' 🪙';document.getElementById('uname').innerText=cur.name;document.getElementById('uemail').innerText=cur.email;document.getElementById('ucoin').innerText=coin;document.getElementById('pbox').innerHTML=cur.name+'<br>'+cur.email+'<br>'+cur.mobile+'<br>Coins: '+coin;document.getElementById('sn').value=cur.name;document.getElementById('sm').value=cur.mobile}
function saveSet(){let cur=JSON.parse(localStorage.getItem('current'));let idx=users.findIndex(x=>x.email===cur.email);users[idx].name=document.getElementById('sn').value||users[idx].name;users[idx].mobile=document.getElementById('sm').value||users[idx].mobile;if(document.getElementById('sp').value)users[idx].pass=document.getElementById('sp').value;localStorage.setItem('users',JSON.stringify(users));localStorage.setItem('current',JSON.stringify(users[idx]));alert('Saved');start()}
function delAcc(){if(!confirm('Delete?'))return;let t=prompt('DELETE likho');if(t!=='DELETE')return;let cur=JSON.parse(localStorage.getItem('current'));users=users.filter(x=>x.email!==cur.email);localStorage.setItem('users',JSON.stringify(users));localStorage.removeItem('current');location.reload()}
function openP(p){document.getElementById('p-bills').style.display=p==='bills'?'block':'none';document.getElementById('p-profile').style.display=p==='profile'?'block':'none';document.getElementById('b-bills').classList.toggle('active',p==='bills');document.getElementById('b-profile').classList.toggle('active',p==='profile')}
function logout(){localStorage.removeItem('current');location.reload()}
start();
</script>
</body>
  </html>
