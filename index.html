<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>V3/title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{background:#0f172a;padding-bottom:90px;overflow-x:hidden}.roshni{position:fixed;inset:0;pointer-events:none}.light{position:absolute;width:200px;height:200px;border-radius:50%;filter:blur(60px);animation:float 6s infinite;opacity:.5}.light1{background:#00b16a;top:10%;left:10%}.light2{background:#f59e0b;top:20%;right:10%;animation-delay:2s}.light3{background:#8b5cf6;bottom:20%;left:30%;animation-delay:4s}@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,-30px) scale(1.2)}}.treasure{position:relative;background:linear-gradient(180deg,#0f172a 0%,#1e293b 50%,#00b16a 100%);padding:24px 16px 30px;text-align:center;color:#fff;border-radius:0 0 30px 30px;overflow:hidden}.chest{font-size:80px;animation:bounce 2s infinite;filter:drop-shadow(0 0 20px #f59e0b)}@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px) scale(1.08)}}.coin{position:absolute;font-size:18px;animation:fall 3s infinite linear}@keyframes fall{0%{transform:translateY(-30px);opacity:0}10%{opacity:1}100%{transform:translateY(220px) rotate(360deg);opacity:0}}.glass{background:rgba(255,255,255,.95);margin:14px;border-radius:24px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);position:relative}.tabs{display:flex;background:#f1f5f9;border-radius:16px;padding:5px;margin:14px 0}.tab{flex:1;text-align:center;padding:12px;border-radius:12px;font-weight:800;font-size:12px;cursor:pointer}.tab.active{background:linear-gradient(135deg,#00b16a,#0a7a47);color:#fff}.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:900;cursor:pointer;margin-top:10px;background:linear-gradient(135deg,#00b16a,#0a7a47);color:#fff}.btn-gold{background:linear-gradient(135deg,#f59e0b,#ef4444)}input,select{width:100%;padding:14px;margin:7px 0;border:1.5px solid #e2e8f0;border-radius:14px}input:focus{border-color:#00b16a}.header{background:linear-gradient(135deg,#00b16a,#0a7a47);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.card{background:#fff;margin:10px;border-radius:20px;padding:16px;box-shadow:0 8px 30px #0001}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.icon-box{background:#fff;padding:14px 6px;border-radius:18px;text-align:center;box-shadow:0 4px 15px #0001;border:1px solid #e2e8f0;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);display:flex;border-top:1px solid #e2e8f0;padding:8px 0;z-index:100;border-radius:20px 20px 0 0}.bottom div{flex:1;text-align:center;font-size:10px;font-weight:700;cursor:pointer}.bottom div.active{color:#00b16a}</style></head><body><div class="roshni"><div class="light light1"></div><div class="light light2"></div><div class="light light3"></div></div><div id="authScreen" style="position:relative;z-index:1;max-width:420px;margin:0 auto"><div class="treasure"><div style="position:absolute;inset:0;pointer-events:none"><span class="coin" style="left:8%">🪙</span><span class="coin" style="left:22%;animation-delay:.4s">💰</span><span class="coin" style="left:38%;animation-delay:.8s">💎</span><span class="coin" style="left:78%;animation-delay:1.6s">💰</span></div><div class="chest">🎁</div><div style="font-weight:900;font-size:24px;margin-top:8px">Kharcha Bachao</div><div style="font-size:12px;margin-top:4px">✨ Pakistan No.1 Bill Bachao ✨</div><div style="margin-top:14px"><span style="background:linear-gradient(135deg,#f59e0b,#ef4444);padding:8px 18px;border-radius:25px;font-size:12px;font-weight:900">🎉 50 Coins FREE Gift!</span></div></div><div class="glass"><div style="text-align:center"><b>🔐 Login / Register</b><p style="font-size:11px;color:#64748b">1 Key Me Dono</p></div><div class="tabs"><div class="tab active" id="tL" onclick="sw('login')">🔐 Login</div><div class="tab" id="tR" onclick="sw('reg')">🎁 Register</div></div><div id="fL"><input id="lE" type="email" placeholder="Email"><input id="lP" type="password" placeholder="Password"><button class="btn" onclick="login()">✨ Login</button></div><div id="fR" style="display:none"><input id="rN" placeholder="Full Name"><input id="rE" type="email" placeholder="Email"><input id="rM" placeholder="Mobile 03XX"><input id="rP" type="password" placeholder="Password"><div style="background:#fffbeb;border:2px dashed #f59e0b;padding:10px;border-radius:12px;margin:6px 0">OTP: <b style="background:#f59e0b;color:#fff;padding:2px 8px;border-radius:6px">123456</b><input id="rO" placeholder="OTP 123456" style="margin-top:6px"></div><button class="btn btn-gold" onclick="reg()">🎁 Register + 50 Coins</button></div><p style="text-align:center;font-size:10px;margin-top:10px"><a href="#" onclick="localStorage.clear();location.reload()">Clear Data</a></p></div></div><div id="mainApp" style="display:none;position:relative;z-index:1"><div class="header"><div style="font-weight:900">💎 Kharcha Bachao <span style="font-size:8px;background:#fff;color:#00b16a;padding:3px 8px;border-radius:20px">V34 3PARTS</span></div><div id="coinTop" style="background:#fff;color:#00b16a;padding:6px 14px;border-radius:25px;font-weight:900;font-size:12px">0 🪙</div></div><div class="card" style="background:linear-gradient(135deg,#00b16a,#0f172a);color:#fff"><div style="display:flex;justify-content:space-between"><div><div style="font-size:11px;opacity:.8">Welcome</div><div style="font-size:18px;font-weight:900" id="uName">User</div><div style="font-size:10px;opacity:.7" id="uEmail">email</div><div style="margin-top:8px"><span style="background:#ffffff22;padding:4px 10px;border-radius:20px;font-size:10px">🔥 <span id="streakTxt">0 Day</span></span></div></div><div style="text-align:right"><div style="font-size:11px;opacity:.8">Coins</div><div style="font-size:26px;font-weight:900" id="uCoin">0</div><div style="font-size:12px">Rs <span id="uRs">0</span></div></div></div></div><div class="card"><h4>⚡ Quick Services</h4><div class="grid4" style="margin-top:12px"><div class="icon-box" onclick="showPage('pakbills')"><div style="font-size:22px">🇵🇰</div><div style="font-size:9px;font-weight:700">Pak Bills</div></div><div class="icon-box" onclick="showPage('upload')"><div style="font-size:22px">📤</div><div style="font-size:9px;font-weight:700">Upload</div></div><div class="icon-box" onclick="showPage('home')"><div style="font-size:22px">🏠</div><div style="font-size:9px;font-weight:700">Home</div></div><div class="icon-box" onclick="showPage('ads')"><div style="font-size:22px">📺</div><div style="font-size:9px;font-weight:700">Ads</div></div></div><div class="grid4" style="margin-top:10px"><div class="icon-box" onclick="showPage('wallet')"><div style="font-size:22px">💸</div><div style="font-size:9px;font-weight:700">Wallet</div></div><div class="icon-box" onclick="showPage('profile')"><div style="font-size:22px">👤</div><div style="font-size:9px;font-weight:700">Profile</div></div><div class="icon-box" onclick="checkIn()"><div style="font-size:22px">🔥</div><div style="font-size:9px;font-weight:700">Check-in</div></div><div class="icon-box" onclick="watchAd()"><div style="font-size:22px">💰</div><div style="font-size:9px;font-weight:700">Earn</div></div></div></div><div id="page-pakbills"><div class="card" style="border:2px solid #00b16a"><h4>🇵🇰 Pakistan All Bills - Search & Pay</h4><div class="tabs"><div class="tab active" id="catE" onclick="billCat('electric')">💡 Bijli</div><div class="tab" id="catG" onclick="billCat('gas')">🔥 Gas</div><div class="tab" id="catW" onclick="billCat('water')">💧 Water</div><div class="tab" id="catI" onclick="billCat('internet')">🌐 Net</div></div><select id="billCompany"><option>-- Company Chuno --</option></select><input id="refNo" placeholder="🔍 Reference No - 14 Digit"><button class="btn" onclick="searchBill()">🔍 Bill Search Karo</button><div id="billResult" style="display:none;margin-top:14px;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:2px solid #00b16a;border-radius:18px;padding:14px"><h5 style="color:#00b16a">✅ Bill Mil Gaya!</h5><div style="font-size:12px;margin-top:10px;line-height:24px"><div style="display:flex;justify-content:space-between"><span>Company:</span><b id="resCompany">LESCO</b></div><div style="display:flex;justify-content:space-between"><span>Ref:</span><b id="resRef">1234</b></div><div style="display:flex;justify-content:space-between"><span>Amount:</span><b>Rs <span id="resAmt">5480</span></b></div></div><div style="margin-top:12px"><button class="btn" onclick="payBill('easypaisa')">💚 Pay - Easypaisa</button><button class="btn" style="background:linear-gradient(135deg,#ff6b00,#ef4444)" onclick="payBill('jazzcash')">❤️ Pay - JazzCash</button><button class="btn" style="background:#fff;color:#00b16a;border:2px solid #00b16a" onclick="payBill('wallet')">🪙 Pay Coins 10% OFF Rs <span id="resDisc">4932</span></button></div></div><div style="margin-top:12px"><h5>📋 History</h5><div id="searchHist" style="font-size:11px;color:#64748b">No search</div></div></div></div><div id="page-upload" style="display:none"><div class="card" style="border:2px dashed #f59e0b"><h4>📤 Bill Upload Alahida - Fee 10%</h4><select id="upType"><option>Bijli - LESCO/MEPCO</option><option>Gas - SNGPL/SSGC</option><option>Water - WASA</option><option>Internet - PTCL</option></select><input id="upAmt" type="number" placeholder="Amount - 1000"><input id="upRef" placeholder="Ref No"><input id="upFile" type="file"><button class="btn" style="background:#f59e0b" onclick="uploadBill()">📤 Upload - Fee 10%</button><div id="upHist" style="font-size:11px;color:#64748b;margin-top:8px">No upload</div></div></div><div id="page-home" style="display:none"><div class="card"><h4>🔥 7 Days Streak</h4><div id="streakBox" style="display:flex;gap:6px;margin:10px 0"></div><button class="btn" onclick="checkIn()">✅ Check-in + Coins</button></div><div class="card"><h4>📺 Ads Earn - 100 Daily</h4><p style="font-size:12px">Today: <span id="adCnt">0/20</span> - Each +5</p><button class="btn" onclick="watchAd()">▶️ Watch Ad +5 Coins</button></div></div><div id="page-ads" style="display:none"><div class="card"><h4>📺 Ads Earn - Wallet</h4><p>Today: <span id="adCnt2">0/20</span> | Total: <span id="wCoin2">0</span> 🪙</p><div style="background:#eff6ff;padding:10px;border-radius:12px;margin:8px 0;font-size:11px">📺 1 Ad = 5 Coins | 20 Ads = 100 Coins Daily</div><button class="btn" onclick="watchAd()">▶️ Watch Ad +5</button></div></div><div id="page-wallet" style="display:none"><div class="card"><h4>💸 Wallet - Easypaisa/JazzCash Payout</h4><p style="font-size:13px">Coins: <span id="wCoin">0</span> 🪙 = Rs <span id="wRs">0</span> | Min 500</p><select id="payMethod"><option>Easypaisa</option><option>JazzCash</option></select><input id="payNum" placeholder="Easypaisa/JazzCash No - 03XX"><input id="payAmt" type="number" placeholder="Coins - Min 500"><button class="btn" onclick="payoutReq()">💸 Payout Request - Friday 10-12</button><div id="payHist" style="font-size:11px;color:#64748b;margin-top:8px">No payout</div></div></div><div id="page-profile" style="display:none"><div class="card"><h4>👤 Profile - Settings</h4><div id="profileBox" style="font-size:12px;line-height:22px;background:#f8fafc;padding:10px;border-radius:12px"></div><div style="margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px"><h5>⚙️ Account Settings</h5><input id="setName" placeholder="Name Change"><input id="setMobile" placeholder="Mobile Change"><input id="setPass" type="password" placeholder="New Password"><button class="btn" onclick="updateProfile()">💾 Save Settings</button></div><div style="margin-top:12px;border-top:1px solid #e2e8f0;padding-top:12px"><h5 style="color:#ef4444">🗑️ Danger Zone</h5><p style="font-size:11px;color:#64748b">Account delete se sara data delete hoga!</p><button class="btn" style="background:#fff;color:#ef4444;border:2px solid #ef4444" onclick="deleteAccount()">🗑️ Delete My Account - Permanent</button><button class="btn" style="background:#ef4444;margin-top:6px" onclick="logout()">🚪 Logout</button></div></div><div class="card"><h4>📜 Policy | Contact</h4><p style="font-size:11px;line-height:18px">📧 azhan02082024@gmail.com<br>📱 03446082767<br>📜 Upload 10% fee | Search Pay 0%<br>🔒 Data safe<br>🇵🇰 LESCO MEPCO GEPCO FESCO IESCO PESCO K-Electric SNGPL SSGC WASA PTCL Nayatel StormFiber<br>💎 V34 ULTIMATE FULL</p></div></div><div class="bottom"><div class="active" id="b-pakbills" onclick="showPage('pakbills')">🇵🇰<br>Bills</div><div id="b-upload" onclick="showPage('upload')">📤<br>Upload</div><div id="b-home" onclick="showPage('home')">🏠<br>Home</div><div id="b-ads" onclick="showPage('ads')">📺<br>Ads</div><div id="b-wallet" onclick="showPage('wallet')">💸<br>Wallet</div><div id="b-profile" onclick="showPage('profile')">👤<br>Profile</div></div></div><script>const P='v34_';function sw(t){document.getElementById('tL').classList.toggle('active',t==='login');document.getElementById('tR').classList.toggle('active',t==='reg');document.getElementById('fL').style.display=t==='login'?'block':'none';document.getElementById('fR').style.display=t==='reg'?'block':'none'}function getU(){try{return JSON.parse(localStorage.getItem(P+'users')||'[]')}catch(e){return []}}function saveU(u){localStorage.setItem(P+'users',JSON.stringify(u))}function reg(){let n=document.getElementById('rN').value.trim(),e=document.getElementById('rE').value.trim().toLowerCase(),m=document.getElementById('rM').value.trim(),p=document.getElementById('rP').value.trim(),o=document.getElementById('rO').value.trim();if(!n||!e||!p){alert('Name Email Pass likho');return}if(o!=='123456'){alert('OTP 123456 likho');return}let users=getU();if(users.find(x=>x.email===e)){alert('Already - Login karo');sw('login');return}let u={id:Date.now(),name:n,email:e,mobile:m,pass:p};users.push(u);saveU(users);localStorage.setItem(P+'current',JSON.stringify(u));localStorage.setItem(P+e+'_coin','50');localStorage.setItem(P+e+'_streak','[]');localStorage.setItem(P+e+'_ad','0');localStorage.setItem(P+e+'_hist','[]');localStorage.setItem(P+e+'_up','[]');localStorage.setItem(P+e+'_pay','[]');start()}function login(){let e=document.getElementById('lE').value.trim().toLowerCase(),p=document.getElementById('lP').value.trim();let u=getU().find(x=>x.email===e&&x.pass===p);if(!u){alert('Email/Pass galat');return}localStorage.setItem(P+'current',JSON.stringify(u));start()}function billCat(cat){let sel=document.getElementById('billCompany');document.getElementById('catE').classList.remove('active');document.getElementById('catG').classList.remove('active');document.getElementById('catW').classList.remove('active');document.getElementById('catI').classList.remove('active');if(cat==='electric'){document.getElementById('catE').classList.add('active');sel.innerHTML='<option>-- Bijli Chuno --</option><option>LESCO - Lahore</option><option>MEPCO - Multan</option><option>GEPCO - Gujranwala</option><option>FESCO - Faisalabad</option><option>IESCO - Islamabad</option><option>PESCO - Peshawar</option><option>K-Electric - Karachi</option>'}if(cat==='gas'){document.getElementById('catG').classList.add('active');sel.innerHTML='<option>-- Gas Chuno --</option><option>SNGPL</option><option>SSGC</option>'}if(cat==='water'){document.getElementById('catW').classList.add('active');sel.innerHTML='<option>-- Water Chuno --</option><option>WASA Lahore</option><option>WASA Faisalabad</option><option>KWSB Karachi</option>'}if(cat==='internet'){document.getElementById('catI').classList.add('active');sel.innerHTML='<option>-- Internet Chuno --</option><option>PTCL</option><option>Nayatel</option><option>StormFiber</option>'}}function searchBill(){let comp=document.getElementById('billCompany').value,ref=document.getElementById('refNo').value.trim();if(!comp||comp.includes('--')){alert('Company Chuno');return}if(!ref||ref.length<6){alert('Ref No Likho');return}let amt=Math.floor(Math.random()*8000)+1200;document.getElementById('resCompany').innerText=comp;document.getElementById('resRef').innerText=ref;document.getElementById('resAmt').innerText=amt.toLocaleString();document.getElementById('resDisc').innerText=Math.floor(amt*0.9).toLocaleString();document.getElementById('billResult').style.display='block';let cur=JSON.parse(localStorage.getItem(P+'current'));let hist=JSON.parse(localStorage.getItem(P+cur.email+'_hist')||'[]');hist.push({comp,ref,amt,date:new Date().toLocaleString()});localStorage.setItem(P+cur.email+'_hist',JSON.stringify(hist));updateHist()}function payBill(m){let amt=document.getElementById('resAmt').innerText.replace(/,/g,'');if(m==='easypaisa'){if(confirm('💚 Easypaisa Rs '+amt+' Pay?'))alert('✅ Easypaisa Success! Rs '+amt+' Paid! EP'+Date.now())}if(m==='jazzcash'){if(confirm('❤️ JazzCash Rs '+amt+' Pay?'))alert('✅ JazzCash Success! Rs '+amt+' Paid! JC'+Date.now())}if(m==='wallet'){let cur=JSON.parse(localStorage.getItem(P+'current'));let coin=parseInt(localStorage.getItem(P+cur.email+'_coin')||'0');let need=Math.floor(parseInt(amt)/2);if(coin<need){alert('Coins kam! Need '+need+' You '+coin);return}if(confirm('🪙 Coins Pay 10% OFF Rs '+document.getElementById('resDisc').innerText)){localStorage.setItem(P+cur.email+'_coin',coin-need);start();alert('✅ Paid Coins!')}}}function uploadBill(){let t=document.getElementById('upType').value,a=document.getElementById('upAmt').value,r=document.getElementById('upRef').value;if(!a||!r){alert('Amount Ref likho');return}let cur=JSON.parse(localStorage.getItem(P+'current'));let up=JSON.parse(localStorage.getItem(P+cur.email+'_up')||'[]');up.push({type:t,amt:a,ref:r,date:new Date().toLocaleString()});localStorage.setItem(P+cur.email+'_up',JSON.stringify(up));alert('✅ Upload Ho Gaya!');updateHist()}function updateHist(){let cur=null;try{cur=JSON.parse(localStorage.getItem(P+'current'))}catch(e){}if(!cur)return;let h=JSON.parse(localStorage.getItem(P+cur.email+'_hist')||'[]');let el=document.getElementById('searchHist');if(el)el.innerHTML=h.length?h.slice(-5).reverse().map(x=>`${x.comp} | ${x.ref} | Rs ${x.amt}`).join('<br>'):'No search';let up=JSON.parse(localStorage.getItem(P+cur.email+'_up')||'[]');let upEl=document.getElementById('upHist');if(upEl)upEl.innerHTML=up.length?up.slice(-3).reverse().map(x=>`${x.type} | Rs ${x.amt}`).join('<br>'):'No upload';let pay=JSON.parse(localStorage.getItem(P+cur.email+'_pay')||'[]');let payEl=document.getElementById('payHist');if(payEl)payEl.innerHTML=pay.length?pay.slice(-3).reverse().map(x=>`${x.amt} to ${x.num}`).join('<br>'):'No payout'}function start(){let cur=null;try{cur=JSON.parse(localStorage.getItem(P+'current')||'null')}catch(e){}if(!cur){document.getElementById('authScreen').style.display='block';document.getElementById('mainApp').style.display='none';billCat('electric');return}document.getElementById('authScreen').style.display='none';document.getElementById('mainApp').style.display='block';let coin=parseInt(localStorage.getItem(P+cur.email+'_coin')||'50');let ad=parseInt(localStorage.getItem(P+cur.email+'_ad')||'0');document.getElementById('coinTop').innerText=coin+' 🪙';document.getElementById('uName').innerText=cur.name;document.getElementById('uEmail').innerText=cur.email+' | '+cur.mobile;document.getElementById('uCoin').innerText=coin;document.getElementById('uRs').innerText=Math.floor(coin/2);document.getElementById('wCoin').innerText=coin;document.getElementById('wRs').innerText=Math.floor(coin/2);document.getElementById('wCoin2').innerText=coin;document.getElementById('adCnt').innerText=ad+'/20';document.getElementById('adCnt2').innerText=ad+'/20';document.getElementById('setName').value=cur.name;document.getElementById('setMobile').value=cur.mobile;let streak=JSON.parse(localStorage.getItem(P+cur.email+'_streak')||'[]');document.getElementById('streakTxt').innerText=streak.length+' Day';let box=document.getElementById('streakBox');if(box){box.innerHTML='';for(let i=0;i<7;i++){let d=streak.includes('d'+i);box.innerHTML+=`<div style="min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid #e2e8f0;${d?'background:#00b16a;color:#fff':''}">${d?'✓':i+1}</div>`}}document.getElementById('profileBox').innerHTML=`<b>${cur.name}</b><br>${cur.email}<br>${cur.mobile}<br>Coins: ${coin}`;updateHist()}function checkIn(){let cur=JSON.parse(localStorage.getItem(P+'current'));let today=new Date().toDateString();if(localStorage.getItem(P+cur.email+'_last')===today){alert('Aaj ho gaya');return}let s=JSON.parse(localStorage.getItem(P+cur.email+'_streak')||'[]');s.push('d'+s.length);if(s.length>7)s=s.slice(-7);let c=parseInt(localStorage.getItem(P+cur.email+'_coin')||'0');c+=5+s.length;localStorage.setItem(P+cur.email+'_streak',JSON.stringify(s));localStorage.setItem(P+cur.email+'_coin',c);localStorage.setItem(P+cur.email+'_last',today);start();alert('✅ '+(5+s.length)+' Coins!')}function watchAd(){let cur=JSON.parse(localStorage.getItem(P+'current'));let a=parseInt(localStorage.getItem(P+cur.email+'_ad')||'0');if(a>=20){alert('20 khatam');return}a++;let c=parseInt(localStorage.getItem(P+cur.email+'_coin')||'0');c+=5;localStorage.setItem(P+cur.email+'_ad',a);localStorage.setItem(P+cur.email+'_coin',c);start();alert('✅ 5 Coins!')}function payoutReq(){let num=document.getElementById('payNum').value,amt=document.getElementById('payAmt').value;if(!num||!amt){alert('Number Coins likho');return}if(parseInt(amt)<500){alert('Min 500');return}let cur=JSON.parse(localStorage.getItem(P+'current'));let c=parseInt(localStorage.getItem(P+cur.email+'_coin')||'0');if(parseInt(amt)>c){alert('Coins kam');return}c-=parseInt(amt);localStorage.setItem(P+cur.email+'_coin',c);let pay=JSON.parse(localStorage.getItem(P+cur.email+'_pay')||'[]');pay.push({num,amt,date:new Date().toLocaleString()});localStorage.setItem(P+cur.email+'_pay',JSON.stringify(pay));alert('✅ Payout Request - Friday');start()}function updateProfile(){let cur=JSON.parse(localStorage.getItem(P+'current'));let users=getU();let idx=users.findIndex(x=>x.email===cur.email);if(idx>=0){users[idx].name=document.getElementById('setName').value||users[idx].name;users[idx].mobile=document.getElementById('setMobile').value||users[idx].mobile;if(document.getElementById('setPass').value)users[idx].pass=document.getElementById('setPass').value;saveU(users);localStorage.setItem(P+'current',JSON.stringify(users[idx]));start();alert('✅ Saved!')}}function deleteAccount(){if(!confirm('Delete? Sara delete hoga!'))return;let t=prompt('DELETE likho:');if(t!=='DELETE')return;let cur=JSON.parse(localStorage.getItem(P+'current'));let users=getU();users=users.filter(x=>x.email!==cur.email);saveU(users);localStorage.removeItem(P+'current');location.reload()}function showPage(p){['pakbills','upload','home','ads','wallet','profile'].forEach(x=>{let el=document.getElementById('page-'+x);if(el)el.style.display=x===p?'block':'none'});document.querySelectorAll('.bottom div').forEach(d=>d.classList.remove('active'));let b=document.getElementById('b-'+p);if(b)b.classList.add('active')}function logout(){localStorage.removeItem(P+'current');location.reload()}start();</script></body></html>
